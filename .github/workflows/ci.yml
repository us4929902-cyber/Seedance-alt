  - name: Use Node.js ${{ matrix.node-version }}
    uses: actions/setup-node@v4
    with:
      node-version: ${{ matrix.node-version }}
      cache: 'npm'

  - name: Show Node / npm versions
    run: |
      node -v
      npm -v

  - name: Install dependencies
    run: npm ci

  - name: Run tests (if defined)
    run: npm test --if-present

  - name: Run optional test_gpt (non-blocking)
    run: |
      if [ -f "./test_gpt.js" ]; then
        node test_gpt.js || echo "test_gpt.js failed (non-blocking)"
      else
        echo "test_gpt.js not present"
      fi

  - name: Lint (if defined)
    run: npm run lint --if-present

  - name: Build (if defined)
    run: npm run build --if-present
