<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple To‑Do (LocalStorage)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" role="main">
    <header>
      <h1>To‑Do List</h1>
      <p class="subtitle">Lightweight tasks app — saves to your browser (localStorage)</p>
    </header>

    <section class="add">
      <form id="new-task-form" aria-label="Add new task">
        <input id="new-task-input" type="text" placeholder="Add a new task and press Enter" aria-label="New task" />
      </form>
      <div class="controls">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button id="clear-completed" class="muted">Clear completed</button>
      </div>
    </section>

    <section>
      <ul id="tasks-list" class="tasks" aria-live="polite"></ul>
    </section>

    <footer>
      <div class="status"><span id="items-count">0</span> items</div>
      <small>Built with ♥ — persists in browser localStorage</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
